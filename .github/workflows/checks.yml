name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q face_lab checks
      - run: python -m face_lab --version
      - run: python -m build
      - run: python scripts/audit_release.py dist
