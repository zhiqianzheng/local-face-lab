[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-face-lab"
version = "0.1.2"
description = "Local webcam facial expression comparison and facial action unit analysis"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{name = "zhiqianzheng"}]
license = "MIT AND Apache-2.0 AND LicenseRef-USC-Research"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "face_lab/resources/licenses/*.txt"]
dependencies = [
  "flask>=3.1,<4", "waitress>=3.0,<4", "numpy>=2,<3",
  "opencv-contrib-python>=4.11,<6", "onnxruntime>=1.20,<2",
  "pillow>=11,<14", "scipy>=1.14,<2", "mediapipe==1.2.3"
]

[project.optional-dependencies]
dev = ["build>=1.2", "playwright>=1.50,<2"]

[project.scripts]
face-lab = "face_lab.cli:main"

[project.urls]
Homepage = "https://github.com/zhiqianzheng/local-face-lab"
Issues = "https://github.com/zhiqianzheng/local-face-lab/issues"

[tool.setuptools.packages.find]
include = ["face_lab*"]

[tool.setuptools.package-data]
face_lab = ["templates/*.html", "static/*.css", "static/*.js", "resources/*.json", "resources/licenses/*.txt"]
